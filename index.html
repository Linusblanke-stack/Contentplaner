const KEY='loewenblutBlueprintsV1'; const PDF_DB='loewenblutBlueprintPdfDB'; let state={blueprints:[],view:'home',activeId:null,filter:'all',search:''};
function uid(p='id'){return p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8)}
function deep(x){return JSON.parse(JSON.stringify(x))}
function load(){try{let s=localStorage.getItem(KEY);state.blueprints=s?JSON.parse(s):deep(DEFAULT_BLUEPRINTS)}catch(e){state.blueprints=deep(DEFAULT_BLUEPRINTS)}; try{localStorage.setItem(KEY,JSON.stringify(state.blueprints))}catch(e){}}
function save(renderToo=true){try{localStorage.setItem(KEY,JSON.stringify(state.blueprints))}catch(e){} if(renderToo) render()}
function bp(id){return state.blueprints.find(x=>x.id===id)}
function stats(b){let a=b.sections.flatMap(s=>s.tasks||[]);return {done:a.filter(t=>t.done).length,total:a.length,p1:a.filter(t=>t.priority==='P1'&&!t.done).length,p2:a.filter(t=>t.priority==='P2'&&!t.done).length,bonus:a.filter(t=>t.priority==='BONUS'&&!t.done).length}}
function esc(s=''){return String(s).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function maps(address){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(address)}
function pill(p){let c=p==='P1'?'p1':p==='P2'?'p2':'bonus';return `<span class="mini ${c}">${esc(p||'')}</span>`}
function pct(st){return st.total?Math.round(st.done/st.total*100):0}
function setToolbar(html){document.querySelector('#toolbar').innerHTML=html}
function setCrumb(s){document.querySelector('#crumb').textContent=s}
function home(){setCrumb('Content-Trip Manager');setToolbar(`<button class="btn primary" onclick="newFromMaster()">＋ Neuer Trip aus Master</button><button class="btn" onclick="showImport()">⇧ Import</button>`);let html='<div class="hero"><h2>Blueprints</h2><div class="muted">Trips abhaken, duplizieren, bearbeiten und als Vorlage weiterverwenden.</div></div><div class="cards">';for(let b of state.blueprints){let st=stats(b);html+=`<div class="card"><div class="split"><div><span class="pill">${b.type==='master'?'MASTER':'TRIP'}</span><h2>${esc(b.title)}</h2></div><div class="right"><b>${pct(st)}%</b><div class="small muted">${st.done}/${st.total}</div></div></div><div class="muted">${esc(b.subtitle||'')}</div><div class="small muted" style="margin-top:4px">${esc(b.dates||'')}</div><div class="progress" style="margin:12px 0"><i style="width:${pct(st)}%"></i></div><div class="statrow"><span class="pill p1">P1 offen ${st.p1}</span><span class="pill p2">P2 ${st.p2}</span><span class="pill bonus">Bonus ${st.bonus}</span></div><button class="btn primary" onclick="openBlueprint('${b.id}')">Öffnen</button> <button class="btn" onclick="duplicateBlueprint('${b.id}')">Duplizieren</button></div>`}html+='</div>';return html}
function openBlueprint(id){state.activeId=id;state.view='blueprint';render()}
function taskMatches(t){if(state.filter==='remaining'&&t.done)return false;if(state.filter==='p1'&&(t.priority!=='P1'||t.done))return false;if(state.filter==='audio'&&t.category!=='Audio')return false;if(state.filter==='bts'&&t.category!=='BTS')return false;if(state.search&&!((t.text||'')+' '+(t.category||'')+' '+(t.mic||'')).toLowerCase().includes(state.search.toLowerCase()))return false;return true}
function blueprintView(b,onlyRemaining=false){let st=stats(b);setCrumb(b.title);setToolbar(`<button class="btn" onclick="state.view='home';render()">← Alle</button><button class="btn gold" onclick="showBlueprintEdit('${b.id}')">✎ Bearbeiten</button>${b.pdf?`<button class="btn" onclick="openBundledPdf('${b.pdf}')">PDF</button>`:''}<button class="btn" onclick="openStoredPdf('${b.id}')">PDF hochladen/öffnen</button><button class="btn" onclick="window.print()">⎙ PDF/Print</button>`);let html=`<div class="hero"><div class="split"><div><h2>${esc(b.title)}</h2><div class="muted">${esc(b.subtitle||'')}</div><div class="small muted">${esc(b.dates||'')}</div></div><div class="right"><b style="font-size:28px">${pct(st)}%</b><div class="small muted">${st.done}/${st.total} erledigt</div></div></div><div class="progress" style="margin-top:12px"><i style="width:${pct(st)}%"></i></div><div class="statrow"><span class="pill p1">P1 offen ${st.p1}</span><span class="pill p2">P2 offen ${st.p2}</span><span class="pill bonus">Bonus ${st.bonus}</span></div></div><div class="filters"><input placeholder="Shots durchsuchen…" value="${esc(state.search)}" oninput="state.search=this.value;render()"><select onchange="state.filter=this.value;render()"><option value="all" ${state.filter==='all'?'selected':''}>Alles</option><option value="remaining" ${state.filter==='remaining'?'selected':''}>Nur offen</option><option value="p1" ${state.filter==='p1'?'selected':''}>Nur P1 offen</option><option value="audio" ${state.filter==='audio'?'selected':''}>Nur Audio</option><option value="bts" ${state.filter==='bts'?'selected':''}>Nur BTS</option></select></div>`;
for(let s of b.sections){let visible=(s.tasks||[]).filter(taskMatches);if((state.filter!=='all'||state.search)&&!visible.length)continue;let ss={done:(s.tasks||[]).filter(t=>t.done).length,total:(s.tasks||[]).length};html+=`<section class="section"><div class="sectionHead"><div><h3>${esc(s.title)}</h3><div class="meta">${esc([s.date,s.time].filter(Boolean).join(' · '))}${s.location?'<br><b>'+esc(s.location)+'</b>':''}${s.address?'<br>'+esc(s.address):''}</div><div class="progress" style="margin-top:8px;max-width:260px"><i style="width:${ss.total?Math.round(ss.done/ss.total*100):0}%"></i></div></div><div class="sectionActions">${s.address?`<a class="btn" target="_blank" href="${maps(s.address)}">⌖ Maps</a>`:''}<button class="btn" onclick="editSection('${b.id}','${s.id}')">✎</button><button class="btn" onclick="addTask('${b.id}','${s.id}')">＋ Shot</button></div></div>${s.notes?`<div class="notes">${esc(s.notes)}</div>`:''}${s.fieldrec?`<div class="fieldrec"><b>FIELD REC</b><br>${esc(s.fieldrec)}</div>`:''}<div class="tasks">`;
for(let t of visible){let idx=s.tasks.indexOf(t);html+=`<div class="task ${t.done?'done':''}"><input class="check" type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${b.id}','${s.id}',${idx})"><div><div class="tasktext">${esc(t.text)}</div><div class="taskmeta">${pill(t.priority)}${t.category?`<span class="mini">${esc(t.category)}</span>`:''}${t.mic?`<span class="mini mic">${esc(t.mic)}</span>`:''}</div></div><div class="taskBtns"><button class="iconbtn" title="Bearbeiten" onclick="editTask('${b.id}','${s.id}',${idx})">✎</button><button class="iconbtn" title="Löschen" onclick="deleteTask('${b.id}','${s.id}',${idx})">×</button></div></div>`}html+=`</div></section>`}html+=`<button class="btn primary" onclick="addSection('${b.id}')">＋ Location / Abschnitt hinzufügen</button>`;return html}
function remainingView(){let b=state.activeId?bp(state.activeId):state.blueprints.find(x=>x.type==='trip');if(!b)return '<div class="empty">Kein Trip vorhanden.</div>';state.filter='remaining';return blueprintView(b,true)}
function dataView(){setCrumb('Daten & Backup');setToolbar('');return `<div class="hero"><h2>Daten & Backup</h2><div class="muted">Strukturierte Blueprints sichern oder auf ein anderes Gerät übertragen.</div></div><div class="cards"><div class="card"><h3>JSON Export</h3><p class="muted">Enthält Blueprints, Häkchen, eigene Shots, Adressen und Notizen.</p><button class="btn primary" onclick="exportAll()">Alles exportieren</button></div><div class="card"><h3>JSON Import</h3><p class="muted">Import ersetzt nichts automatisch; neue Blueprints werden ergänzt, gleiche IDs aktualisiert.</p><button class="btn" onclick="showImport()">Datei importieren</button></div><div class="card"><h3>PDFs</h3><p class="muted">Eigene PDFs werden lokal im Browser/IndexedDB gespeichert und bleiben auf diesem Gerät.</p><button class="btn" onclick="showPdfManager()">PDF-Manager</button></div><div class="card"><h3>Zurücksetzen</h3><p class="muted">Setzt App-Daten auf Schwerin + Universal-Master zurück.</p><button class="btn danger" onclick="resetAll()">App zurücksetzen</button></div></div>`}
function render(){document.querySelectorAll('.navbtn').forEach(x=>x.classList.toggle('active',x.dataset.view===state.view||(state.view==='blueprint'&&x.dataset.view==='home')));let html='';if(state.view==='home')html=home();else if(state.view==='blueprint')html=blueprintView(bp(state.activeId));else if(state.view==='remaining')html=remainingView();else if(state.view==='master'){let m=state.blueprints.find(x=>x.type==='master');state.activeId=m?.id;state.filter='all';html=m?blueprintView(m):'<div class="empty">Master fehlt.</div>'}else html=dataView();document.querySelector('#main').innerHTML=html}
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;state.search='';state.filter=b.dataset.view==='remaining'?'remaining':'all';render()});
function toggleTask(bid,sid,i){let s=bp(bid).sections.find(x=>x.id===sid);s.tasks[i].done=!s.tasks[i].done;save()}
function duplicateBlueprint(id){let x=deep(bp(id));x.id=uid('bp');x.title+=' - Kopie';x.type='trip';x.pdf='';x.sections.forEach(s=>{s.id=uid('sec');s.tasks.forEach(t=>t.done=false)});state.blueprints.push(x);save();openBlueprint(x.id)}
function newFromMaster(){let m=state.blueprints.find(x=>x.type==='master');let x=deep(m);x.id=uid('trip');x.type='trip';x.title='Neuer Content-Trip';x.subtitle='Aus Universal-Master erstellt';x.dates='';x.pdf='';x.sections.forEach(s=>{s.id=uid('sec');s.tasks.forEach(t=>t.done=false)});state.blueprints.push(x);save(false);showBlueprintEdit(x.id,true)}
function modal(html){document.querySelector('#modal').innerHTML=html;document.querySelector('#modalWrap').classList.add('show')}
function closeModal(){document.querySelector('#modalWrap').classList.remove('show');document.querySelector('#modal').innerHTML=''}document.querySelector('#modalWrap').onclick=e=>{if(e.target.id==='modalWrap')closeModal()}
function showBlueprintEdit(id,isNew=false){let b=bp(id);modal(`<h3>${isNew?'Neuen Trip anlegen':'Blueprint bearbeiten'}</h3><div class="formgrid"><div class="full"><label>Titel</label><input id="eTitle" value="${esc(b.title)}"></div><div class="full"><label>Untertitel</label><input id="eSub" value="${esc(b.subtitle||'')}"></div><div><label>Stadt</label><input id="eCity" value="${esc(b.city||'')}"></div><div><label>Datum</label><input id="eDates" value="${esc(b.dates||'')}"></div></div><div style="margin-top:14px"><button class="btn primary" onclick="saveBlueprintEdit('${id}')">Speichern</button> <button class="btn" onclick="closeModal()">Abbrechen</button></div>`)}
function saveBlueprintEdit(id){let b=bp(id);b.title=document.querySelector('#eTitle').value;b.subtitle=document.querySelector('#eSub').value;b.city=document.querySelector('#eCity').value;b.dates=document.querySelector('#eDates').value;save(false);closeModal();state.activeId=id;state.view='blueprint';render()}
function editSection(bid,sid){let s=bp(bid).sections.find(x=>x.id===sid);modal(`<h3>Location / Abschnitt bearbeiten</h3><div class="formgrid"><div class="full"><label>Titel</label><input id="sTitle" value="${esc(s.title)}"></div><div><label>Datum</label><input id="sDate" value="${esc(s.date||'')}"></div><div><label>Zeit</label><input id="sTime" value="${esc(s.time||'')}"></div><div class="full"><label>Location</label><input id="sLoc" value="${esc(s.location||'')}"></div><div class="full"><label>Adresse / Maps-Suche</label><input id="sAddr" value="${esc(s.address||'')}"></div><div class="full"><label>Notiz</label><textarea id="sNotes">${esc(s.notes||'')}</textarea></div><div class="full"><label>Field Recording</label><textarea id="sField">${esc(s.fieldrec||'')}</textarea></div></div><div style="margin-top:14px"><button class="btn primary" onclick="saveSectionEdit('${bid}','${sid}')">Speichern</button> <button class="btn danger" onclick="deleteSection('${bid}','${sid}')">Abschnitt löschen</button> <button class="btn" onclick="closeModal()">Abbrechen</button></div>`)}
function saveSectionEdit(bid,sid){let s=bp(bid).sections.find(x=>x.id===sid);s.title=q('#sTitle').value;s.date=q('#sDate').value;s.time=q('#sTime').value;s.location=q('#sLoc').value;s.address=q('#sAddr').value;s.notes=q('#sNotes').value;s.fieldrec=q('#sField').value;save(false);closeModal();render()}
function q(s){return document.querySelector(s)}
function addSection(bid){let s={id:uid('sec'),title:'Neue Location',date:'',time:'',location:'',address:'',kind:'location',notes:'',fieldrec:'',tasks:[]};bp(bid).sections.push(s);save(false);editSection(bid,s.id)}
function deleteSection(bid,sid){if(!confirm('Abschnitt wirklich löschen?'))return;let b=bp(bid);b.sections=b.sections.filter(x=>x.id!==sid);save(false);closeModal();render()}
function editTask(bid,sid,i){let t=bp(bid).sections.find(x=>x.id===sid).tasks[i];modal(`<h3>Shot bearbeiten</h3><div class="formgrid"><div class="full"><label>Text</label><textarea id="tText">${esc(t.text)}</textarea></div><div><label>Priorität</label><select id="tPri"><option ${t.priority==='P1'?'selected':''}>P1</option><option ${t.priority==='P2'?'selected':''}>P2</option><option ${t.priority==='BONUS'?'selected':''}>BONUS</option></select></div><div><label>Kategorie</label><input id="tCat" value="${esc(t.category||'')}"></div><div class="full"><label>Mic / Audio</label><input id="tMic" value="${esc(t.mic||'')}"></div></div><div style="margin-top:14px"><button class="btn primary" onclick="saveTaskEdit('${bid}','${sid}',${i})">Speichern</button> <button class="btn" onclick="closeModal()">Abbrechen</button></div>`)}
function saveTaskEdit(bid,sid,i){let t=bp(bid).sections.find(x=>x.id===sid).tasks[i];t.text=q('#tText').value;t.priority=q('#tPri').value;t.category=q('#tCat').value;t.mic=q('#tMic').value;save(false);closeModal();render()}
function addTask(bid,sid){let s=bp(bid).sections.find(x=>x.id===sid);s.tasks.push({text:'Neuer Shot',priority:'P2',category:'Shot',done:false});save(false);editTask(bid,sid,s.tasks.length-1)}
function deleteTask(bid,sid,i){if(!confirm('Shot löschen?'))return;bp(bid).sections.find(x=>x.id===sid).tasks.splice(i,1);save()}
function exportAll(){let blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),blueprints:state.blueprints},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='loewenblut-blueprints.json';a.click();URL.revokeObjectURL(a.href)}
function showImport(){modal(`<h3>Blueprint-JSON importieren</h3><p class="muted">Eine zuvor exportierte JSON-Datei auswählen.</p><input type="file" id="imp" accept="application/json,.json"><div style="margin-top:14px"><button class="btn primary" onclick="importJson()">Importieren</button> <button class="btn" onclick="closeModal()">Abbrechen</button></div>`)}
async function importJson(){let f=q('#imp').files[0];if(!f)return alert('Datei wählen.');try{let d=JSON.parse(await f.text());let arr=d.blueprints||d;if(!Array.isArray(arr))throw Error();for(let x of arr){let i=state.blueprints.findIndex(b=>b.id===x.id);if(i>=0)state.blueprints[i]=x;else state.blueprints.push(x)}save(false);closeModal();render()}catch(e){alert('Ungültige JSON-Datei.')}}
function resetAll(){if(!confirm('Alle Häkchen und eigenen Änderungen zurücksetzen?'))return;localStorage.removeItem(KEY);load();render()}
function openBundledPdf(file){window.open(file,'_blank')}
function idb(){return new Promise((res,rej)=>{let r=indexedDB.open(PDF_DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('pdfs');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function putPdf(id,file){let db=await idb();return new Promise((res,rej)=>{let tx=db.transaction('pdfs','readwrite');tx.objectStore('pdfs').put(file,id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function getPdf(id){let db=await idb();return new Promise((res,rej)=>{let r=db.transaction('pdfs').objectStore('pdfs').get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function openStoredPdf(id){let f=await getPdf(id);if(f){let url=URL.createObjectURL(f);modal(`<h3>PDF</h3><iframe class="pdfviewer" src="${url}"></iframe><div style="margin-top:10px"><a class="btn" target="_blank" href="${url}">Extern öffnen</a> <button class="btn" onclick="choosePdf('${id}')">Ersetzen</button> <button class="btn" onclick="closeModal()">Schließen</button></div>`)}else choosePdf(id)}
function choosePdf(id){modal(`<h3>PDF für diesen Blueprint speichern</h3><p class="muted">Die Datei bleibt lokal auf diesem Gerät im Browser gespeichert.</p><input type="file" id="pdfIn" accept="application/pdf"><div style="margin-top:14px"><button class="btn primary" onclick="storeChosenPdf('${id}')">Speichern</button> <button class="btn" onclick="closeModal()">Abbrechen</button></div>`)}
async function storeChosenPdf(id){let f=q('#pdfIn').files[0];if(!f)return alert('PDF wählen.');await putPdf(id,f);closeModal();openStoredPdf(id)}
function showPdfManager(){let rows=state.blueprints.map(b=>`<div class="task"><div></div><div><b>${esc(b.title)}</b></div><div><button class="btn" onclick="openStoredPdf('${b.id}')">PDF</button></div></div>`).join('');modal(`<h3>PDF-Manager</h3><div class="tasks">${rows}</div><div style="margin-top:12px"><button class="btn" onclick="closeModal()">Schließen</button></div>`)}
load();render(); if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
